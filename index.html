<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>GAMES FLORIDA - LAIDEL</title>
    <style>
        :root { --g: #00ff00; --b: #000; }
        body { background: var(--b); color: var(--g); font-family: monospace; margin: 0; padding: 5px; overflow-x: hidden; }
        
        /* Visor Resistente con Zoom */
        .visor-marco {
            border: 2px solid var(--g);
            height: 60vh;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: auto; /* Esencial para mover la foto con zoom */
            background: #080808;
        }
        #img-visor { max-width: 100%; height: auto; display: block; }

        .ui-panel { border: 1px solid var(--g); padding: 10px; background: #111; }
        .precio { font-size: 2.2em; color: yellow; margin: 5px 0; }
        .btn { 
            background: var(--b); color: var(--g); border: 1px solid var(--g);
            padding: 15px; width: 100%; margin: 4px 0; font-weight: bold; font-size: 1.1em;
        }
        .btn-sync { background: #004400; border-color: #00ff00; }
        .btn-buy { background: var(--g); color: var(--b); }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
    </style>
</head>
<body>

    <button class="btn btn-sync" onclick="document.getElementById('fileInput').click()">📁 SINCRONIZAR CARPETA</button>
    <input type="file" id="fileInput" webkitdirectory style="display:none">

    <div class="ui-panel">
        <div id="txt-nombre">ESPERANDO ARCHIVOS...</div>
        <div class="precio" id="txt-precio">$0.00</div>
    </div>

    <button class="btn btn-buy" onclick="comprar()">🛒 AÑADIR AL CARRITO</button>

    <div class="visor-marco">
        <img id="img-visor" src="" alt="Usa el botón Sincronizar">
    </div>

    <div class="grid-3">
        <button class="btn" onclick="mover(-1)">◀</button>
        <button class="btn" onclick="reset()">RESET</button>
        <button class="btn" onclick="mover(1)">▶</button>
    </div>

    <button class="btn" style="color:red; border-color:red; margin-top:20px;" onclick="location.reload()">REINICIAR APP</button>

    <script>
        const RUTA = 'Archivos/';
        let db_precios = {};
        let db_taxi = 0;
        let mis_fotos = [];
        let index = 0;

        // 1. CARGAR CONFIGURACIÓN DE GITHUB
        async function cargarConfig() {
            try {
                const resP = await fetch(RUTA + 'precio.txt');
                if(resP.ok) {
                    const t = await resP.text();
                    t.split('\n').forEach(l => {
                        let partes = l.split(':');
                        if(partes.length == 2) db_precios[partes[0].trim()] = partes[1].trim();
                    });
                }
                const resT = await fetch(RUTA + 'taxi.txt');
                if(resT.ok) {
                    const t = await resT.text();
                    db_taxi = parseInt(t) || 0;
                }
            } catch(e) { console.log("Modo local activo"); }
        }

        // 2. MANEJO DE ARCHIVOS LOCALES
        document.getElementById('fileInput').onchange = function(e) {
            mis_fotos = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
            if(mis_fotos.length > 0) ver(0);
        };

        // 3. VISOR DE IMÁGENES
        function ver(i) {
            index = i;
            const f = mis_fotos[i];
            const img = document.getElementById('img-visor');
            const nom = document.getElementById('txt-nombre');
            const pre = document.getElementById('txt-precio');

            img.src = URL.createObjectURL(f);
            nom.innerText = f.name.toUpperCase();
            
            let p = db_precios[f.name] || "CONSULTAR";
            pre.innerText = p.includes('$') ? p : "$" + p;
        }

        function mover(d) {
            let n = index + d;
            if(n >= 0 && n < mis_fotos.length) ver(n);
        }

        function reset() {
            const img = document.getElementById('img-visor');
            img.style.width = "100%";
            const marco = document.querySelector('.visor-marco');
            marco.scrollLeft = 0;
            marco.scrollTop = 0;
        }

        function comprar() {
            const n = document.getElementById('txt-nombre').innerText;
            const p = document.getElementById('txt-precio').innerText;
            alert("PEDIDO:\n" + n + "\n" + p + "\n+ ENVÍO: $" + db_taxi + "\n\nEnviando a WhatsApp...");
        }

        window.onload = cargarConfig;
    </script>
</body>
</html>
