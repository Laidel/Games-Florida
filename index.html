<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Florida Games v15.8 - Matrix Online</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* BLOQUE 2: Estilos Matrix Originales */
        :root { --neon: #00ff41; --bg: #000; --red: #ff4444; --dark-neon: #008f11; --taxi-yellow: #ffcc00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #eee; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        #welcomeScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999999; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border: 5px solid var(--neon); }
        .welcome-title { color: var(--neon); font-size: 2rem; text-shadow: 0 0 15px var(--neon); margin-bottom: 30px; padding: 0 20px; }
        
        .action-btn { background: var(--neon); color: #000; border: 4px solid var(--dark-neon); padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 10px; box-shadow: 0 4px 0 var(--dark-neon); display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .secondary-btn { background: #111; color: var(--neon); border-color: var(--neon); box-shadow: 0 4px 0 #005a17; }
        
        .container { width: 100%; max-width: 500px; flex: 1; border: 1px solid #333; border-radius: 12px; background: #050505; padding: 10px; position: relative; }
        .grid-3x { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .grid-item { background: #111; border: 1px solid #222; border-radius: 8px; position: relative; overflow: hidden; }
        .price-tag { position: absolute; top: 22px; right: 5px; background: rgba(0,0,0,0.85); color: var(--neon); font-size: 0.65rem; padding: 2px 5px; border: 1px solid var(--neon); z-index: 5; }

        .ticket-input { width: 100%; background: #111; color: #fff; border: 1px solid #333; padding: 12px; margin-bottom: 5px; font-family: monospace; outline: none; font-size: 0.9rem; font-weight: bold; }
        .taxi-container { display: flex; flex-direction: column; gap: 5px; padding: 10px; border: 1px solid #333; border-radius: 8px; margin-bottom: 15px; background: #050505; color: #fff; }
        .taxi-row { display: flex; justify-content: space-between; align-items: center; }

        .console-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; width: 100%; }
        .console-btn { background: #111; color: var(--neon); border: 1px solid var(--neon); padding: 6px 2px; font-size: 0.55rem; border-radius: 4px; font-weight: bold; text-align: center; min-height: 35px; display: flex; align-items: center; justify-content: center; }
        .console-btn.active { background: var(--neon); color: #000; box-shadow: 0 0 15px var(--neon); border-color: #fff; }
        .search-box { width: 100%; background: #111; border: 2px solid var(--neon); border-radius: 8px; padding: 12px; color: var(--neon); margin-bottom: 15px; outline: none; font-family: monospace; }
        
        /* BLOQUE 3: Lightbox con Zoom Mejorado */
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000000; flex-direction: column; overflow: hidden; }
        #zoomContainer { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; overflow: auto; cursor: grab; }
        #expandedImg { max-width: 95%; max-height: 85%; border: 2px solid var(--neon); transition: transform 0.1s ease-out; }
    </style>
</head>
<body>
    <audio id="sndClick" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="sndAdd" src="https://assets.mixkit.co/active_storage/sfx/595/595-preview.mp3"></audio>

    <div id="welcomeScreen">
        <h1 class="welcome-title">Florida Games</h1>
        <button class="action-btn" style="width:280px" onclick="enterApp()">INICIAR APP</button>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:500px; margin-bottom:10px;">
        <button class="action-btn" onclick="showPage('catalogScreen')" style="background:#FFFFFF; color:black; border:4px solid var(--neon);"><b>CATÁLOGO</b></button>
        <button class="action-btn" onclick="showPage('cartScreen')" style="background:#FFEB3B; color:black; border:4px solid var(--neon);">🛒 <b>CARRITO</b></button>
    </div>

    <div class="container">
        <div id="catalogScreen">
            <div class="console-menu">
                <button class="console-btn active" onclick="filterCat('TODO')">TODO</button>
                <button class="console-btn" onclick="filterCat('SNES')">SNES</button>
                <button class="console-btn" onclick="filterCat('NES')">NES</button>
                <button class="console-btn" onclick="filterCat('PS1')">PS1</button>
                <button class="console-btn" onclick="filterCat('PS2')">PS2</button>
                <button class="console-btn" onclick="filterCat('XBOX360')">X360</button>
                </div>
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 BUSCAR JUEGO..." onkeyup="renderGrid()">
            <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none" onchange="loadFolder(this)">
            <button class="action-btn" style="margin-bottom:10px; background:#4CAF50; color:white;" onclick="document.getElementById('folderInput').click()">📂 <b>SINCRONIZAR DATOS</b></button>
            <div class="grid-3x" id="imageGrid"></div>
        </div>

        <div id="cartScreen" style="display:none;">
            <div id="captureArea" style="background:#000; padding:15px; border:1px solid var(--neon);">
                <h3 style="color:var(--neon); text-align:center; border-bottom:2px dashed var(--neon);">TICKET FLORIDA GAMES</h3>
                <input type="text" class="ticket-input" placeholder="CLIENTE">
                <div id="cartList"></div>
                <div style="text-align:right; border-top:2px solid var(--neon); padding-top:10px;">
                    <h2 id="finalPrice" style="color:#fff; margin:0;">$0.00</h2>
                </div>
            </div>
            <button class="action-btn" onclick="takeSnapshot()">📸 GENERAR TICKET</button>
        </div>
    </div>

    <div id="lightbox">
        <div id="zoomContainer" onclick="closeLightbox()">
            <img id="expandedImg" src="">
        </div>
        <button class="action-btn" onclick="closeLightbox()" style="position:absolute; bottom:20px; width:80%; left:10%;">ATRÁS</button>
    </div>

    <script>
        /* BLOQUE 6: Lógica de Datos y Sincronización */
        let allItems = [], cart = [], priceList = {}, currentCat = 'TODO';

        function enterApp() { document.getElementById('welcomeScreen').style.display='none'; }
        function showPage(id) {
            document.getElementById('catalogScreen').style.display = (id==='catalogScreen'?'block':'none');
            document.getElementById('cartScreen').style.display = (id==='cartScreen'?'block':'none');
        }

        async function loadFolder(input) {
            const files = Array.from(input.files);
            // Leer precio.txt
            const pF = files.find(f => f.name.toLowerCase() === 'precio.txt');
            if(pF) {
                const t = await pF.text();
                t.split('\n').forEach(l => {
                    const [n, p] = l.split(':');
                    if(n && p) priceList[n.trim()] = parseFloat(p.trim());
                });
            }
            // Cargar Imágenes
            allItems = [];
            files.filter(f => f.type.startsWith('image/')).forEach(file => {
                const url = URL.createObjectURL(file);
                const path = file.webkitRelativePath.toUpperCase();
                let cat = 'OTRO';
                if(path.includes('SNES')) cat='SNES'; else if(path.includes('NES')) cat='NES';
                else if(path.includes('PS1')) cat='PS1'; else if(path.includes('PS2')) cat='PS2';
                allItems.push({ url, name: file.name, price: priceList[file.name] || 0, cat });
            });
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('imageGrid');
            const search = document.getElementById('searchInput').value.toUpperCase();
            grid.innerHTML = '';
            allItems.filter(i => (currentCat==='TODO' || i.cat===currentCat) && i.name.toUpperCase().includes(search)).forEach(i => {
                const d = document.createElement('div');
                d.className = 'grid-item';
                d.innerHTML = `
                    <div class="price-tag">$${i.price}</div>
                    <img src="${i.url}" style="width:100%; aspect-ratio:1; object-fit:cover;" onclick="openZoom('${i.url}')">
                    <button class="action-btn" style="font-size:0.55rem; padding:5px; margin:0;" onclick="addCart('${i.name}', ${i.price})">AÑADIR</button>`;
                grid.appendChild(d);
            });
        }

        function openZoom(url) {
            document.getElementById('expandedImg').src = url;
            document.getElementById('lightbox').style.display = 'flex';
        }
        function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; }

        function addCart(n, p) {
            cart.push({ n, p });
            updateCart();
        }

        function updateCart() {
            const list = document.getElementById('cartList');
            let total = 0; list.innerHTML = '';
            cart.forEach(item => {
                total += item.p;
                list.innerHTML += `<div style="display:flex; justify-content:space-between; color:white; font-size:0.7rem; border-bottom:1px solid #222; padding:5px;">
                    <span>${item.n.split('.')[0]}</span><span>$${item.p}</span>
                </div>`;
            });
            document.getElementById('finalPrice').innerText = "TOTAL: $" + total.toFixed(2);
        }

        function filterCat(c) {
            currentCat = c;
            document.querySelectorAll('.console-btn').forEach(b => b.classList.toggle('active', b.innerText === c));
            renderGrid();
        }

        function takeSnapshot() {
            html2canvas(document.getElementById('captureArea')).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Ticket_Florida.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
