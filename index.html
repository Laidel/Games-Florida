<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Games-Florida - Catálogo</title>
    <style>
        /* Estilo para que la imagen sea movible y escalable */
        .contenedor-imagen {
            overflow: auto; /* Permite mover la imagen si es más grande que el cuadro */
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid #0f0;
            margin: 10px;
            background: #000;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            /* Mejora la calidad al ampliar */
            image-rendering: auto; 
        }
        body { background-color: #000; color: #0f0; font-family: sans-serif; text-align: center; }
        .btn { padding: 15px; margin: 5px; border-radius: 10px; font-weight: bold; cursor: pointer; display: inline-block; }
        .btn-add { background: #0f0; color: #000; width: 80%; font-size: 1.2em; }
        .btn-back { background: #f44; color: #fff; }
    </style>
</head>
<body>

    <div id="detalle-juego">
        <h2 id="nombre-juego">Cargando...</h2>
        <h1 id="precio-visor">PRECIO: $0</h1>
        
        <button class="btn btn-add">AÑADIR AL CARRITO</button>
        
        <div class="contenedor-imagen">
            <img id="img-visor" src="" alt="Portada del juego">
        </div>

        <div>
            <button class="btn" style="background:#050">-</button>
            <button class="btn" style="background:#050">RESET</button>
            <button class="btn" style="background:#050">+</button>
            <button class="btn btn-back">ATRÁS</button>
        </div>
        
        <button class="btn" style="background:#f00; color:#fff; width: 90%; margin-top: 20px;">
            ▶ VER GAMEPLAY EN YOUTUBE
        </button>
    </div>

    <script>
        // CONFIGURACIÓN IMPORTANTE: Ruta de tus archivos
        const rutaArchivos = 'Archivos/'; 

        async function cargarDatos() {
            try {
                // Ahora busca precio.txt DENTRO de la carpeta Archivos
                const resp = await fetch(rutaArchivos + 'precio.txt');
                const texto = await resp.text();
                
                // Aquí va tu lógica de búsqueda de precios...
                // Ejemplo rápido para que veas el cambio:
                console.log("Precios cargados desde la carpeta Archivos");
            } catch (e) {
                console.error("Error cargando precios: ", e);
            }
        }

        // Llamar a la carga al iniciar
        cargarDatos();
    </script>
</body>
</html>
