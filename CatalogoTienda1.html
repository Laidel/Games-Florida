<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Florida Games v19.5 - Visuales Menu & Extra Store Update</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --neon: #00ff41; --bg: #000; --red: #ff4444; --dark-neon: #008f11; --taxi-yellow: #ffcc00; --blue-btn: #2196F3; --deep-blue: #001f3f; --visuales-red: #b71c1c; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #eee; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        #welcomeScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999999; background: var(--deep-blue); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border: none; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        .welcome-title { color: white; font-size: 1.5rem; text-shadow: 0 0 10px rgba(255,255,255,0.5); margin-bottom: 30px; padding: 0 20px; text-transform: uppercase; animation: fadeInDown 1.2s ease-out; }
        .welcome-action-btn { background: white; color: #000; border: 4px solid #ccc; padding: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 280px; text-transform: uppercase; box-shadow: 0 4px 0 #999; font-size: 0.9rem; }
        .version-tag-welcome { position: absolute; bottom: 10px; right: 15px; font-size: 0.7rem; color: rgba(255,255,255,0.5); }

        /* HEADER Y NAVEGACIÓN - ACTUALIZADO A CUATRO BOTONES */
        .header-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; width: 100%; max-width: 500px; margin-bottom: 10px; }
        .action-btn { background: var(--neon); color: #000; border: 4px solid var(--dark-neon); padding: 10px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 10px; box-shadow: 0 4px 0 var(--dark-neon); display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.2s; font-size: 0.65rem; }
        
        .btn-nav { height: 60px; padding: 3px; flex-direction: column; line-height: 1.1; justify-content: center; border: 4px solid transparent; }
        .btn-nav.active { border: 4px solid var(--neon) !important; box-shadow: 0 0 15px var(--neon), 0 4px 0 var(--dark-neon) !important; color: #000 !important; }

        /* Estilo específico para el botón VISUALES activo */
        #btn-visuales.active { border: 4px solid white !important; box-shadow: 0 0 15px white, 0 4px 0 #ccc !important; color: white !important; }

        .container { width: 100%; max-width: 500px; flex: 1; border: 1px solid #333; border-radius: 12px; background: #050505; padding: 10px; position: relative; }
        .grid-3x { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .grid-item { background: #111; border: 1px solid #222; border-radius: 8px; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .price-tag { position: absolute; top: 22px; right: 5px; background: rgba(0,0,0,0.85); color: var(--neon); font-size: 0.65rem; padding: 2px 5px; border: 1px solid var(--neon); z-index: 5; }
        
        .cloud-sync-container { display: flex; align-items: center; width: 100%; margin-bottom: 10px; gap: 10px; }
        #syncToast { color: white; font-weight: bold; font-size: 0.7rem; display: none; white-space: nowrap; }

        .ticket-input { width: 100%; background: #111; color: #fff; border: 1px solid #333; padding: 10px; margin-bottom: 5px; font-family: monospace; }
        .taxi-container { display: flex; flex-direction: column; gap: 5px; padding: 10px; border: 1px solid #333; border-radius: 8px; margin-bottom: 15px; background: #050505; }
        .switch-taxi { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch-taxi input { opacity: 0; width: 0; height: 0; }
        .slider-taxi { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #222; transition: .4s; border-radius: 34px; border: 1px solid #fff; }
        .slider-taxi:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: #fff; transition: .4s; border-radius: 50%; }
        input:checked + .slider-taxi { background-color: var(--taxi-yellow); }
        input:checked + .slider-taxi:before { transform: translateX(24px); background-color: #000; }

        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000000; flex-direction: column; overflow: hidden; }
        #zoomContainer { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        #expandedImg { max-width: 95%; max-height: 80%; border: 2px solid var(--neon); transition: transform 0.1s ease-out; }
        .zoom-info-panel { background: rgba(0,0,0,0.9); width: 100%; padding: 15px; border-bottom: 2px solid var(--neon); position: absolute; top: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; }

        .console-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; }
        .console-btn { background: #111; color: var(--neon); border: 1px solid var(--neon); padding: 6px 2px; font-size: 0.5rem; border-radius: 4px; font-weight: bold; text-align: center; min-height: 30px; display: flex; align-items: center; justify-content: center; }
        .console-btn.active { background: var(--neon); color: #000; }
        
        /* Estilo específico para botones VISUALES activos en el submenú */
        .visuales-sub-btn.active { background: white; color: var(--visuales-red); border-color: white; }

        .extra-menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .extra-btn { background: #111; color: white; border: 2px solid var(--blue-btn); padding: 15px 10px; border-radius: 8px; font-weight: bold; font-size: 0.7rem; text-align: center; box-shadow: 0 4px 0 #0D47A1; cursor: pointer; }
        .extra-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #0D47A1; }
    </style>
</head>
<body>

    <audio id="sndClick" src="ARCHIVOS/click.mp3"></audio>
    <audio id="sndAdd" src="ARCHIVOS/add.mp3"></audio>
    <audio id="sndTrash" src="ARCHIVOS/trash.mp3"></audio>
    <audio id="sndWelcome" src="ARCHIVOS/welcome_entry.mp3"></audio>

    <div id="syncToast">☁️ SINCRONIZANDO...</div>

    <div id="welcomeScreen">
        <h1 class="welcome-title">BIENVENIDO A LA TIENDA DE JUEGOS FLORIDA</h1>
        <button class="welcome-action-btn" onclick="playSnd('sndClick'); enterApp()">ENTRAR A LA TIENDA</button>
        <div class="version-tag-welcome">v19.5</div>
    </div>

    <div class="header-grid">
        <button id="btn-catalog" class="action-btn btn-nav active" onclick="showPage('catalogScreen')" style="background:#FFFFFF; color:black;">📂<b>CATÁLOGO</b></button>
        <button id="btn-visuales" class="action-btn btn-nav" onclick="showPage('visualesScreen')" style="background:var(--visuales-red); color:white; border-color:white;">🎬<b>VISUALES</b></button>
        <button id="btn-extra" class="action-btn btn-nav" onclick="showPage('extraScreen')" style="background:var(--blue-btn); color:white;">⭐<b>EXTRA</b></button>
        <button id="btn-cart" class="action-btn btn-nav" onclick="showPage('cartScreen')" style="position:relative; background:#FFEB3B; color:black;">
            <div id="cartCount" style="display:none; position:absolute; top:-5px; right:-5px; background:var(--red); color:white; font-size:10px; padding:2px 6px; border-radius:50%; border:1px solid white;">0</div>
            🛒<b>CARRITO</b>
        </button>
    </div>

    <div class="container">
        <div id="catalogScreen">
            <div class="console-menu">
                <button class="console-btn active" onclick="filterCat('TODO')">TODO</button>
                <button class="console-btn" onclick="filterCat('SNES')">SNES</button>
                <button class="console-btn" onclick="filterCat('NES')">NES</button>
                <button class="console-btn" onclick="filterCat('PS1')">PS1</button>
                <button class="console-btn" onclick="filterCat('PS2')">PS2</button>
                <button class="console-btn" onclick="filterCat('PS3')">PS3</button>
                <button class="console-btn" onclick="filterCat('PS4')">PS4</button>
                <button class="console-btn" onclick="filterCat('SWITCH')">SWITCH</button>
                <button class="console-btn" onclick="filterCat('PSP')">PSP</button>
                <button class="console-btn" onclick="filterCat('Wii')">Wii</button>
                <button class="console-btn" onclick="filterCat('N64')">N64</button>
                <button class="console-btn" onclick="filterCat('3DS')">3DS</button>
                <button class="console-btn" onclick="filterCat('DS')">DS</button>
                <button class="console-btn" onclick="filterCat('FIGURAS 3D')">FIG 3D</button>
                <button class="console-btn" onclick="filterCat('PC')">PC</button>
                <button class="console-btn" onclick="filterCat('SEGA')">SEGA</button>
                <button class="console-btn" onclick="filterCat('XBOX360')">X360</button>
            </div>
            <input type="text" id="searchInput" style="width:100%; background:#111; border:2px solid var(--neon); padding:10px; color:var(--neon); margin-bottom:10px;" placeholder="🔍 BUSCAR JUEGO..." onkeyup="renderGrid()">
            
            <div class="cloud-sync-container">
                <button class="action-btn" style="background:#2196F3; color:white; border:4px solid #0D47A1; margin:0; flex:1;" onclick="loadFromCloud()">☁️ <b>SINCRONIZAR NUBE</b></button>
            </div>
            
            <div class="grid-3x" id="imageGrid"></div>
        </div>

        <div id="visualesScreen" style="display:none;">
            <div class="console-menu" style="border-color:var(--visuales-red);">
                <button class="console-btn active visuales-sub-btn" onclick="filterCatVisuales('TODO')">TODO</button>
                <button class="console-btn visuales-sub-btn" onclick="filterCatVisuales('PELICULAS')">PELÍCULAS</button>
                <button class="console-btn visuales-sub-btn" onclick="filterCatVisuales('SERIES')">SERIES</button>
                <button class="console-btn visuales-sub-btn" onclick="filterCatVisuales('ANIMADOS')">ANIMADOS</button>
                <button class="console-btn visuales-sub-btn" onclick="filterCatVisuales('NOVELAS')">NOVELAS</button>
                <button class="console-btn visuales-sub-btn" onclick="filterCatVisuales('SERIES ANIMADAS')" style="grid-column: span 2;">SERIES ANIMADAS</button>
            </div>
            <input type="text" id="searchInputVisuales" style="width:100%; background:#111; border:2px solid white; padding:10px; color:white; margin-bottom:10px;" placeholder="🔍 BUSCAR VISUAL..." onkeyup="renderGridVisuales()">
            
            <div class="grid-3x" id="imageGridVisuales"></div>
        </div>

        <div id="extraScreen" style="display:none;">
            <h2 style="color:var(--blue-btn); text-align:center; margin-top:10px;">TIENDA EXTRA</h2>
            <div class="extra-menu">
                <div class="extra-btn" onclick="playSnd('sndClick')">👕 ROPA</div>
                <div class="extra-btn" onclick="playSnd('sndClick')">🔌 ELECTRODOMÉSTICOS</div>
                <div class="extra-btn" onclick="playSnd('sndClick')">💻 COMPUTADORAS</div>
                <div class="extra-btn" onclick="playSnd('sndClick')">✨ EXTRAS</div>
                <div class="extra-btn" onclick="playSnd('sndClick')">🛒 MERCADO</div>
                <div class="extra-btn" onclick="playSnd('sndClick')">🎵 MUSICA</div>
                <div class="extra-btn" onclick="playSnd('sndClick')">🤖 ANDROID</div>
                <div class="extra-btn" onclick="playSnd('sndClick')">🍬 CONFITURAS</div>
                <div class="extra-btn" onclick="playSnd('sndClick')">🏗️ CONSTRUCCION</div>
                <div class="extra-btn" onclick="playSnd('sndClick')">🧸 JUGUETES</div>
                
                <div class="extra-btn" onclick="showPiezas()" style="grid-column: span 2; border-color:var(--neon); color:var(--neon);">⚙️ PIEZAS</div>
            </div>
        </div>

        <div id="cartScreen" style="display:none;">
            <div id="captureArea" style="background:#000; padding:15px; border:1px solid var(--neon); border-radius:8px;">
                <h3 style="color:var(--neon); text-align:center; border-bottom:1px dashed var(--neon); padding-bottom:10px; margin:0;">TICKET FLORIDA GAMES</h3>
                <input type="text" id="cName" class="ticket-input" placeholder="CLIENTE">
                <input type="text" id="cAddr" class="ticket-input" placeholder="DIRECCIÓN" style="margin-bottom:10px;">
                <div class="taxi-container">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-size:0.7rem; color:white;">¿INCLUIR ENVÍO (TAXI)?</span>
                        <label class="switch-taxi"><input type="checkbox" id="check-taxi" onchange="updateCart()"><span class="slider-taxi"></span></label>
                    </div>
                </div>
                <div id="cartList"></div>
                <h2 id="finalPrice" style="text-align:right; color:white; border-top:1px solid var(--neon); padding-top:10px;">$0.00</h2>
            </div>
            <button class="action-btn" onclick="takeSnapshot()">📸 GENERAR TICKET</button>
        </div>
        <div style="text-align:center; font-size:0.6rem; color:#444; margin-top:10px;">Florida Games v19.5 - 2026</div>
    </div>

    <div id="lightbox">
        <div class="zoom-info-panel">
            <div id="zoomName" style="color:#fff; font-size:0.9rem; margin-bottom:10px;"></div>
            <div id="zoomPrice" style="color:var(--neon); font-size:1.5rem; font-weight:bold; margin-bottom:10px;"></div>
            <div style="display:flex; gap:10px; width:100%;">
                <button id="btnZoomAdd" class="action-btn" style="flex:2;">AÑADIR AL CARRITO</button>
                <button class="action-btn" style="flex:1; background:#f44336; border-color:#b71c1c; color:white;" onclick="closeLightbox()">CERRAR</button>
            </div>
        </div>
        <div id="zoomContainer"><img id="expandedImg" src=""></div>
    </div>

    <script>
        const RUTA_PRINCIPAL = "ARCHIVOS";
        let allItems = [], cart = [], priceList = {}, taxiP = 0;
        let currentCatCatalog = 'TODO', currentCatVisuales = 'TODO';
        let isCloudLoaded = false;

        function playSnd(id){ const s=document.getElementById(id); if(s){ s.pause(); s.currentTime=0; s.play().catch(e=>{}); } }
        window.onload = () => { playSnd('sndWelcome'); };
        function enterApp(){ document.getElementById('welcomeScreen').style.display='none'; }

        // NAVEGACIÓN PRINCIPAL ACTUALIZADA A CUATRO PANTALLAS
        function showPage(id){
            playSnd('sndClick');
            ['catalogScreen', 'visualesScreen', 'extraScreen', 'cartScreen'].forEach(p => document.getElementById(p).style.display = 'none');
            ['catalog', 'visuales', 'extra', 'cart'].forEach(b => document.getElementById('btn-'+b).classList.remove('active'));
            document.getElementById(id).style.display = 'block';
            document.getElementById('btn-' + id.replace('Screen','')).classList.add('active');
            if(id === 'catalogScreen') renderGrid();
            if(id === 'visualesScreen') renderGridVisuales();
        }

        // Lógica para mostrar piezas desde Extra
        function showPiezas() { showPage('catalogScreen'); filterCat('PIEZAS'); }

        async function loadFromCloud() {
            const toast = document.getElementById('syncToast');
            toast.style.display = 'inline-block';
            playSnd('sndClick');
            try {
                const res = await fetch(`https://api.github.com/repos/Laidel/Games-Florida/contents/${RUTA_PRINCIPAL}`);
                const data = await res.json();
                allItems = [];
                const pf = data.find(f => f.name.toLowerCase() === 'precio.txt');
                if(pf){ const rt = await (await fetch(pf.download_url)).text(); rt.split('\n').forEach(l=>{ const [n,p]=l.split(':'); if(n&&p) priceList[n.trim()]=parseFloat(p.trim()); }); }
                const tf = data.find(f => f.name.toLowerCase() === 'taxi.txt');
                if(tf){ const tt = await (await fetch(tf.download_url)).text(); taxiP = parseFloat(tt.trim()) || 0; }

                for (const item of data) {
                    if (item.type === "dir") {
                        const sRes = await fetch(item.url); const sData = await sRes.json();
                        sData.forEach(f => {
                            if (f.name.match(/\.(jpg|jpeg|png|webp)$/i)) {
                                let cat = item.name.toUpperCase();
                                // Categorización inteligente multimedia basada en carpetas
                                if(cat === 'PELICULAS' || cat === 'SERIES' || cat === 'ANIMADOS' || cat === 'NOVELAS' || cat === 'SERIES ANIMADAS') {
                                    allItems.push({ url: f.download_url, urlHD: f.download_url, name: f.name, price: priceList[f.name] || 0, cat: cat, type: 'visual' });
                                } else {
                                    if(f.name.toUpperCase().includes('PIEZA')) cat = 'PIEZAS';
                                    allItems.push({ url: f.download_url, urlHD: f.download_url, name: f.name, price: priceList[f.name] || 0, cat: cat, type: 'game' });
                                }
                            }
                        });
                    }
                }
                toast.style.display = 'none';
                isCloudLoaded = true;
                renderGrid();
                alert("NUBE SINCRONIZADA ✅");
            } catch (e) { toast.style.display = 'none'; alert("Error de conexión"); }
        }

        // FILTRADO CATALOGO (Juegos)
        function filterCat(c){ playSnd('sndClick'); currentCatCatalog = c; document.querySelectorAll('#catalogScreen .console-btn').forEach(b => b.classList.toggle('active', (b.innerText === c || (c==='TODO' && b.innerText==='TODO')))); renderGrid(); }

        // FILTRADO VISUALES
        function filterCatVisuales(c){ playSnd('sndClick'); currentCatVisuales = c; document.querySelectorAll('#visualesScreen .visuales-sub-btn').forEach(b => b.classList.toggle('active', (b.innerText === c || (c==='TODO' && b.innerText==='TODO')))); renderGridVisuales(); }

        // RENDER GRID CATALOGO
        function renderGrid(){
            const grid = document.getElementById('imageGrid');
            const search = document.getElementById('searchInput').value.toUpperCase();
            grid.innerHTML = '';
            // Solo muestra items tipo 'game'
            allItems.filter(i => i.type === 'game' && (currentCatCatalog==='TODO' || i.cat===currentCatCatalog) && i.name.toUpperCase().includes(search)).forEach(i => {
                const d = document.createElement('div'); d.className = 'grid-item';
                d.innerHTML = `<div class="price-tag">$${i.price}</div>
                    <img src="${i.url}" style="width:100%; aspect-ratio:1; object-fit:cover;" onclick="openZoom('${i.urlHD}', ${i.price}, '${i.name}')">
                    <button class="action-btn" style="margin:0; border-radius:0; font-size:0.6rem; border-width:2px;" onclick="addCart('${i.urlHD}', '${i.name}', ${i.price})">AÑADIR</button>`;
                grid.appendChild(d);
            });
        }

        // RENDER GRID VISUALES
        function renderGridVisuales(){
            const grid = document.getElementById('imageGridVisuales');
            const search = document.getElementById('searchInputVisuales').value.toUpperCase();
            grid.innerHTML = '';
            if(!isCloudLoaded) { grid.innerHTML = '<div style="grid-column: span 3; color:white; text-align:center;">Sincroniza la Nube en Catálogo primero.</div>'; return; }
            // Solo muestra items tipo 'visual'
            allItems.filter(i => i.type === 'visual' && (currentCatVisuales==='TODO' || i.cat===currentCatVisuales) && i.name.toUpperCase().includes(search)).forEach(i => {
                const d = document.createElement('div'); d.className = 'grid-item';
                // Usamos el estilo Rojo/Blanco de visuales
                d.innerHTML = `<div class="price-tag" style="border-color:white; color:white;">$${i.price}</div>
                    <img src="${i.url}" style="width:100%; aspect-ratio:1; object-fit:cover; border:1px solid rgba(255,255,255,0.2);" onclick="openZoom('${i.urlHD}', ${i.price}, '${i.name}')">
                    <button class="action-btn" style="margin:0; border-radius:0; font-size:0.6rem; border-width:2px; background:var(--visuales-red); color:white; border-color:white; box-shadow:0 4px 0 #ccc;" onclick="addCart('${i.urlHD}', '${i.name}', ${i.price})">AÑADIR</button>`;
                grid.appendChild(d);
            });
        }

        function openZoom(url, price, name){ 
            document.getElementById('expandedImg').src = url; 
            document.getElementById('zoomName').innerText = name.split('.')[0].toUpperCase(); 
            document.getElementById('zoomPrice').innerText = "PRECIO: $" + price;
            document.getElementById('btnZoomAdd').onclick = () => { addCart(url, name, price); closeLightbox(); };
            document.getElementById('lightbox').style.display = 'flex'; 
        }
        function closeLightbox(){ document.getElementById('lightbox').style.display = 'none'; }

        function addCart(u, n, p) { playSnd('sndAdd'); cart.push({u, n, p}); updateCart(); }
        function delItem(i) { playSnd('sndTrash'); cart.splice(i, 1); updateCart(); }

        function updateCart() {
            const count = document.getElementById('cartCount');
            count.innerText = cart.length; count.style.display = cart.length > 0 ? 'block' : 'none';
            let total = 0;
            const list = document.getElementById('cartList');
            list.innerHTML = '';
            cart.forEach((item, i) => {
                total += item.p;
                list.innerHTML += `<div style="display:flex; justify-content:space-between; color:white; font-size:0.7rem; padding:5px; border-bottom:1px solid #222;">
                    <span>${item.n.split('.')[0]}</span><span>$${item.p} <button onclick="delItem(${i})" style="background:red; color:white; border:none; padding:2px 5px; border-radius:4px;">X</button></span>
                </div>`;
            });
            if(document.getElementById('check-taxi').checked) total += taxiP;
            document.getElementById('finalPrice').innerText = "TOTAL: $" + total.toFixed(2);
        }

        function takeSnapshot() {
            html2canvas(document.getElementById('captureArea'), { backgroundColor: "#000" }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Ticket_Florida.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }
    </script>
</body>
</html>
