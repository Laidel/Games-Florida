<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florida Games - Offline Ready</title>
    <style>
        :root { --neon: #00ff41; --bg: #000; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; text-align: center; padding: 20px; }
        .status-card { border: 2px solid var(--neon); padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .online { color: var(--neon); }
        .offline { color: #ff4444; }
        button { background: var(--neon); border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        #gameGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 20px; }
        .card { background: #111; padding: 10px; border-radius: 5px; border: 1px solid #333; }
        .icon { width: 40px; height: 40px; }
    </style>
</head>
<body>

    <div class="status-card">
        <h2 id="net-status">Verificando conexión...</h2>
        <p id="cache-msg">El sistema de caché está cargando...</p>
    </div>

    <button onclick="document.getElementById('folderInput').click()">📁 SINCRONIZAR JUEGOS</button>
    <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none" onchange="scan(this.files)">

    <div id="gameGrid"></div>

    <script>
        // --- DETECTAR CONEXIÓN ---
        function updateNet() {
            const s = document.getElementById('net-status');
            s.innerText = navigator.onLine ? "ESTADO: ONLINE" : "ESTADO: OFFLINE (MODO CACHÉ)";
            s.className = navigator.onLine ? "online" : "offline";
        }
        window.addEventListener('online', updateNet);
        window.addEventListener('offline', updateNet);
        updateNet();

        // --- REGISTRO DEL SERVICE WORKER ---
        if ('serviceWorker' in navigator) {
            // Se usa '../sw.js' porque el HTML está en /ARCHIVOS/ y el SW en la raíz
            navigator.serviceWorker.register('../sw.js', { scope: '/Games-Florida/' })
            .then(reg => {
                document.getElementById('cache-msg').innerText = "✅ Catálogo protegido para uso sin internet";
                console.log("SW Registrado en Florida Games");
            })
            .catch(err => {
                document.getElementById('cache-msg').innerText = "❌ Error en caché: " + err;
            });
        }

        // --- LÓGICA DE ICONOS ---
        const icons = {
            "chd": "https://img.icons8.com/color/48/mame.png",
            "zip": "https://img.icons8.com/color/48/super-nintendo.png"
        };

        function scan(files) {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = "";
            Array.from(files).forEach(f => {
                const ext = f.name.split('.').pop().toLowerCase();
                if(icons[ext]) {
                    grid.innerHTML += `<div class="card"><img src="${icons[ext]}" class="icon"><br>${f.name.substring(0,10)}</div>`;
                }
            });
        }
    </script>
</body>
</html>
