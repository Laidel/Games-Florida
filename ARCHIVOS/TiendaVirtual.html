<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florida Games V8.2 - Pro</title>
    <style>
        :root { --neon: #00ff41; --bg: #000; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; text-align: center; padding: 15px; }
        .box { border: 1px solid var(--neon); padding: 15px; border-radius: 10px; margin-bottom: 15px; background: #111; }
        #status { font-weight: bold; font-size: 14px; }
        .btn-sync { background: var(--neon); color: #000; border: none; padding: 15px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 20px; }
        .card { background: #1a1a1a; padding: 10px; border-radius: 8px; border: 1px solid #333; font-size: 10px; }
        .icon { width: 35px; height: 35px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="box">
        <div id="status">Verificando Sistema...</div>
        <small id="cache-info">Cargando Service Worker...</small>
    </div>

    <button class="btn-sync" onclick="document.getElementById('fileInput').click()">📁 SELECCIONAR CARPETA</button>
    <input type="file" id="fileInput" webkitdirectory directory multiple style="display:none" onchange="scan(this.files)">

    <div class="grid" id="gameGrid"></div>

    <script>
        // --- REGISTRO DEL SERVICE WORKER ---
        if ('serviceWorker' in navigator) {
            // Buscamos el sw.js en la misma carpeta del HTML
            navigator.serviceWorker.register('./sw.js')
            .then(reg => {
                document.getElementById('cache-info').innerText = "✅ CACHÉ ACTIVADA";
            })
            .catch(err => {
                document.getElementById('cache-info').innerText = "❌ ERROR: " + err.message;
            });
        }

        // --- ESTADO DE RED ---
        function checkNet() {
            const s = document.getElementById('status');
            s.innerText = navigator.onLine ? "🌐 MODO ONLINE" : "🔌 MODO OFFLINE (CACHÉ)";
            s.style.color = navigator.onLine ? "#00ff41" : "#ff4444";
        }
        window.addEventListener('online', checkNet);
        window.addEventListener('offline', checkNet);
        checkNet();

        // --- LÓGICA DE ICONOS ---
        const icons = {
            "chd": "https://img.icons8.com/color/48/mame.png",
            "zip": "https://img.icons8.com/color/48/super-nintendo.png",
            "gba": "https://img.icons8.com/color/48/game-boy-advance.png"
        };

        function scan(files) {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = "";
            Array.from(files).forEach(f => {
                const ext = f.name.split('.').pop().toLowerCase();
                if(icons[ext]) {
                    grid.innerHTML += `
                        <div class="card">
                            <img src="${icons[ext]}" class="icon">
                            <div>${f.name.substring(0,12)}</div>
                        </div>`;
                }
            });
        }
    </script>
</body>
</html>
