<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florida Games - Reset Demo (Carpeta ARCHIVOS)</title>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: 'Courier New', monospace; 
            text-align: center; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .status { 
            border: 2px solid #00ff41; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            width: 100%;
            max-width: 400px;
            background: #050505;
        }
        .btn-reset { 
            background: #ff4444; 
            color: white; 
            border: 2px solid #b71c1c; 
            padding: 15px; 
            border-radius: 10px; 
            cursor: pointer; 
            width: 100%; 
            max-width: 400px;
            font-weight: bold; 
            font-size: 1rem;
            box-shadow: 0 4px 0 #800;
            transition: 0.2s;
        }
        .btn-reset:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #800;
        }
    </style>
</head>
<body>

    <div class="status">
        <h2 style="color: #00ff41;">SISTEMA DE RESET</h2>
        <h3 id="net-status">Verificando...</h3>
        <p id="cache-info">Localizando ClearCache.js en /ARCHIVOS/...</p>
    </div>

    <button class="btn-reset" onclick="borrarCacheTotal()">
        🗑️ FORZAR LIMPIEZA DE CACHÉ
    </button>

    <script>
        // --- FUNCIÓN DE LIMPIEZA TOTAL ---
        async function borrarCacheTotal() {
            if (confirm("⚠️ ¿Estás seguro? Se borrarán todos los archivos guardados para forzar una carga limpia desde GitHub.")) {
                try {
                    // 1. Desregistrar Service Workers
                    if ('serviceWorker' in navigator) {
                        const registros = await navigator.serviceWorker.getRegistrations();
                        for (let r of registros) await r.unregister();
                    }
                    
                    // 2. Borrar Cachés
                    const llaves = await caches.keys();
                    await Promise.all(llaves.map(k => caches.delete(k)));

                    alert("✅ Caché de /ARCHIVOS/ borrada correctamente.");
                    
                    // 3. Recarga forzada
                    window.location.reload(true);
                } catch (error) {
                    alert("Error al limpiar: " + error);
                }
            }
        }

        // --- REGISTRO DEL SERVICE WORKER (Relativo a /ARCHIVOS/) ---
        if ('serviceWorker' in navigator) {
            // Al estar ambos en la misma carpeta, usamos ./
            navigator.serviceWorker.register('./ClearCache.js')
            .then(reg => {
                document.getElementById('cache-info').innerText = "✅ Service Worker: ACTIVO (En ARCHIVOS)";
                document.getElementById('cache-info').style.color = "#00ff41";
                console.log("Registro exitoso en scope:", reg.scope);
            })
            .catch(err => {
                document.getElementById('cache-info').innerText = "❌ Error en SW: " + err.message;
                document.getElementById('cache-info').style.color = "#ff4444";
            });
        }

        // --- DETECTOR DE ESTADO DE RED ---
        function updateStatus() {
            const s = document.getElementById('net-status');
            const isOnline = navigator.onLine;
            s.innerText = isOnline ? "🌐 SEÑAL: ONLINE" : "🔌 SEÑAL: OFFLINE (MODO CACHÉ)";
            s.style.color = isOnline ? "#00ff41" : "#ffcc00";
        }

        window.addEventListener('online', updateStatus);
        window.addEventListener('offline', updateStatus);
        updateStatus();
    </script>
</body>
</html>
