<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Florida Games v18.0 - Zoom HD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --neon: #00ff41; --bg: #000; --red: #ff4444; --dark-neon: #008f11; --taxi-yellow: #ffcc00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #eee; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        #welcomeScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999999; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border: 5px solid var(--neon); }
        .welcome-title { color: var(--neon); font-size: 2rem; text-shadow: 0 0 15px var(--neon); margin-bottom: 30px; padding: 0 20px; }
        
        .action-btn { background: var(--neon); color: #000; border: 4px solid var(--dark-neon); padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 10px; box-shadow: 0 4px 0 var(--dark-neon); display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .secondary-btn { background: #111; color: var(--neon); border-color: var(--neon); box-shadow: 0 4px 0 #005a17; }
        
        .btn-disabled { background: #222 !important; color: #555 !important; border-color: #333 !important; box-shadow: none !important; pointer-events: none; }
        .btn-whatsapp-active { background: var(--neon) !important; color: #000 !important; border: 4px solid #fff !important; box-shadow: 0 0 20px var(--neon) !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .container { width: 100%; max-width: 500px; flex: 1; border: 1px solid #333; border-radius: 12px; background: #050505; padding: 10px; position: relative; }
        .grid-3x { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .grid-item { background: #111; border: 1px solid #222; border-radius: 8px; position: relative; overflow: hidden; }
        .price-tag { position: absolute; top: 22px; right: 5px; background: rgba(0,0,0,0.85); color: var(--neon); font-size: 0.65rem; padding: 2px 5px; border: 1px solid var(--neon); z-index: 5; }

        .ticket-input { width: 100%; background: #111; color: #fff; border: 1px solid #333; padding: 12px; margin-bottom: 5px; font-family: monospace; outline: none; font-size: 0.9rem; font-weight: bold; }
        .taxi-container { display: flex; flex-direction: column; gap: 5px; padding: 10px; border: 1px solid #333; border-radius: 8px; margin-bottom: 15px; background: #050505; color: #fff; }
        .taxi-row { display: flex; justify-content: space-between; align-items: center; }
        .taxi-pattern { display: grid; grid-template-columns: repeat(3, 12px); grid-template-rows: repeat(2, 12px); border: 1px solid #fff; line-height: 0; }
        .c-y { background: var(--taxi-yellow); width: 12px; height: 12px; }
        .c-b { background: #000; width: 12px; height: 12px; }

        .switch-taxi { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch-taxi input { opacity: 0; width: 0; height: 0; }
        .slider-taxi { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #222; transition: .4s; border-radius: 34px; border: 1px solid #fff; }
        .slider-taxi:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: #fff; transition: .4s; border-radius: 50%; }
        input:checked + .slider-taxi { background-color: var(--taxi-yellow); border-color: #000; }
        input:checked + .slider-taxi:before { transform: translateX(24px); background-color: #000; }
        
        .white-price { color: #ffffff !important; font-weight: bold; }
        .ticket-footer { margin-top: 15px; padding-top: 10px; border-top: 1px dashed var(--neon); text-align: center; font-size: 0.75rem; color: #fff; }
        
        .console-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; width: 100%; }
        .console-btn { background: #111; color: var(--neon); border: 1px solid var(--neon); padding: 6px 2px; font-size: 0.55rem; border-radius: 4px; font-weight: bold; text-align: center; min-height: 35px; display: flex; align-items: center; justify-content: center; }
        .console-btn.active { background: var(--neon); color: #000; box-shadow: 0 0 15px var(--neon); border-color: #fff; }
        .search-box { width: 100%; background: #111; border: 2px solid var(--neon); border-radius: 8px; padding: 12px; color: var(--neon); margin-bottom: 15px; outline: none; font-family: monospace; }
        
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000000; flex-direction: column; overflow: hidden; touch-action: none; }
        #zoomContainer { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; cursor: grab; position: relative; padding-bottom: 80px; }
        #expandedImg { max-width: 95%; max-height: 90%; border: 2px solid var(--neon); box-shadow: 0 0 20px var(--neon); transition: transform 0.1s ease-out; z-index: 1; transform-origin: center center; }
        .zoom-info-panel { background: rgba(0,0,0,0.85); width: 100%; padding: 15px; display: flex; flex-direction: column; align-items: center; border-bottom: 2px solid var(--neon); position: absolute; top: 0; z-index: 10; }
        .youtube-bar { position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px; background: rgba(0,0,0,0.95); border-top: 2px solid var(--neon); z-index: 20; display: flex; justify-content: center; }
        .yt-btn { margin: 0; background: #ff0000; color: white; border: 2px solid white; box-shadow: 0 0 15px #ff0000; font-size: 1.1rem; width: 90%; }
    </style>
</head>
<body>

    <audio id="sndClick" src="ARCHIVOS/click.mp3"></audio>
    <audio id="sndAdd" src="ARCHIVOS/add.mp3"></audio>
    <audio id="sndTrash" src="ARCHIVOS/trash.mp3"></audio>

    <div id="welcomeScreen">
        <h1 class="welcome-title">Florida Games</h1>
        <button class="action-btn" style="width:280px" onclick="playSnd('sndClick'); enterApp()">INICIAR APP</button>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:500px; margin-bottom:10px;">
        <button class="action-btn" onclick="showPage('catalogScreen')" style="background:#FFFFFF; color:black; border:4px solid var(--neon);"><b>CATÁLOGO</b></button>
        <button class="action-btn" onclick="showPage('cartScreen')" style="position:relative; background:#FFEB3B; color:black; border:4px solid var(--neon);">
            <div id="cartCount" style="display:none; position:absolute; top:-10px; right:-5px; background:var(--red); color:white; font-size:12px; padding:2px 8px; border-radius:50%; z-index:10; border:1px solid white;">0</div>
            <span style="font-size:1.8rem;">🛒</span><b>CARRITO</b>
        </button>
    </div>

    <div class="container">
        <div id="catalogScreen">
            <div class="console-menu">
                <button class="console-btn active" onclick="filterCat('TODO')">TODO</button>
                <button class="console-btn" onclick="filterCat('SNES')">SNES</button>
                <button class="console-btn" onclick="filterCat('NES')">NES</button>
                <button class="console-btn" onclick="filterCat('PS1')">PS1</button>
                <button class="console-btn" onclick="filterCat('PS2')">PS2</button>
                <button class="console-btn" onclick="filterCat('PS4')">PS4</button>
                <button class="console-btn" onclick="filterCat('SWITCH')">SWITCH</button>
                <button class="console-btn" onclick="filterCat('FIGURAS 3D')">FIG 3D</button>
            </div>
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 BUSCAR JUEGO..." onkeyup="renderGrid()">
            
            <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none" onchange="loadFolder(this)">
            <button class="action-btn" style="margin-bottom:5px; background:#4CAF50; color:white; border:4px solid var(--neon);" onclick="playSnd('sndClick'); document.getElementById('folderInput').click()">📂 <b>SINCRONIZAR LOCAL</b></button>
            <button class="action-btn" style="margin-bottom:10px; background:#2196F3; color:white; border:4px solid #0D47A1;" onclick="playSnd('sndClick'); loadFromCloud()">☁️ <b>SINCRONIZAR NUBE (ARCHIVOS)</b></button>
            
            <div class="grid-3x" id="imageGrid"></div>
        </div>

        <div id="cartScreen" style="display:none;">
            <div id="captureArea" style="background:#000; padding:15px; border:1px solid var(--neon); border-radius:8px;">
                <h3 style="color:var(--neon); text-align:center; border-bottom:2px dashed var(--neon); padding-bottom:10px; margin-top:0;">TICKET FLORIDA GAMES</h3>
                <input type="text" id="cName" class="ticket-input" placeholder="CLIENTE">
                <input type="text" id="cAddr" class="ticket-input" placeholder="DIRECCIÓN" style="margin-bottom:10px;">
                <div class="taxi-container">
                    <div class="taxi-row">
                        <span style="font-size:0.75rem;">¿INCLUIR ENVÍO (TAXI)?</span>
                        <label class="switch-taxi"><input type="checkbox" id="check-taxi" onchange="playSnd('sndClick'); updateCart()"><span class="slider-taxi"></span></label>
                    </div>
                    <div class="taxi-row" style="margin-top:5px;">
                        <div id="taxiStatus" style="font-size:0.7rem; color:var(--red);">NO INCLUIDO</div>
                        <div style="display:flex; align-items:center; gap:8px;">
                            <div id="taxiVal" class="white-price" style="font-size:1rem;">$0.00</div>
                            <div class="taxi-pattern"><div class="c-y"></div><div class="c-b"></div><div class="c-y"></div><div class="c-b"></div><div class="c-y"></div><div class="c-b"></div></div>
                        </div>
                    </div>
                </div>
                <div id="cartList"></div>
                <div style="text-align:right; border-top:2px solid var(--neon); padding-top:10px; margin-top:10px;">
                    <h2 id="finalPrice" class="white-price" style="margin:0; font-size:1.8rem;">$0.00</h2>
                </div>
                <div class="ticket-footer">
                    <div id="ticketDateTime"></div>
                </div>
            </div>
            <button id="btnGenerate" class="action-btn" onclick="playSnd('sndClick'); takeSnapshot()">📸 GENERAR TICKET</button>
            <button id="btnWA" class="action-btn secondary-btn" onclick="playSnd('sndClick'); openWhatsApp()" style="display:none;">💬 ENVIAR POR WHATSAPP</button>
            <button class="action-btn" style="background:#333; color:#fff; border:none;" onclick="resetTicketButtons()">🔄 NUEVO PEDIDO</button>
        </div>
    </div>

    <div id="lightbox">
        <div class="zoom-info-panel">
            <div id="zoomName" style="color:#fff; font-size:0.95rem; text-align:center; margin-bottom:8px; width:90%; overflow:hidden; text-transform:uppercase;"></div>
            <div id="zoomPrice" style="color:var(--neon); font-size:1.8rem; font-weight:bold; margin-bottom:15px;"></div>
            <div style="display:flex; flex-direction:column; gap:10px; width:90%;">
                <button id="btnZoomAdd" class="action-btn" style="margin:0; height:50px; font-size:1.2rem;">AÑADIR AL CARRITO</button>
                <div style="display:flex; gap:10px; justify-content:center;">
                    <button class="action-btn secondary-btn" style="width:50px; margin:0;" onclick="adjustZoom(-0.5)">-</button>
                    <button class="action-btn secondary-btn" style="flex:1; margin:0;" onclick="resetZoom()">RESET</button>
                    <button class="action-btn secondary-btn" style="width:50px; margin:0;" onclick="adjustZoom(0.5)">+</button>
                    <button class="action-btn" style="flex:1; margin:0; background:#f44336; color:white; border:4px solid #b71c1c;" onclick="closeLightbox()">ATRÁS</button>
                </div>
            </div>
        </div>
        <div id="zoomContainer"><img id="expandedImg" src=""></div>
        <div class="youtube-bar"><button id="btnGameplay" class="action-btn yt-btn"><span>▶</span> <b>VER GAMEPLAY EN YOUTUBE</b></button></div>
    </div>

    <script>
        const RUTA_PRINCIPAL = "ARCHIVOS";
        let allItems = [], cart = [], priceList = {}, taxiP = 0, currentCat = 'TODO';
        let scale = 1, pX = 0, pY = 0, start = {x:0, y:0}, isDrag = false, evCache = [], prevDiff = -1;

        function playSnd(id){ const s=document.getElementById(id); if(s){ s.pause(); s.currentTime=0; s.play().catch(()=>{}); } }
        function enterApp(){ document.getElementById('welcomeScreen').style.display='none'; }
        function showPage(id){ 
            closeLightbox(); 
            document.getElementById('catalogScreen').style.display = (id==='catalogScreen'?'block':'none'); 
            document.getElementById('cartScreen').style.display = (id==='cartScreen'?'block':'none'); 
            if(id==='cartScreen') updateDateTime();
            window.scrollTo(0,0);
        }

        function closeLightbox(){ document.getElementById('lightbox').style.display = 'none'; resetZoom(); }
        function adjustZoom(a){ scale = Math.min(Math.max(0.5, scale + a), 5); updateT(); }
        function resetZoom(){ scale = 1; pX = 0; pY = 0; updateT(); }
        function updateT(){ document.getElementById('expandedImg').style.transform = `translate(${pX}px, ${pY}px) scale(${scale})`; }

        const zCon = document.getElementById('zoomContainer');
        zCon.onpointerdown = e => { evCache.push(e); isDrag = true; start = {x: e.clientX - pX, y: e.clientY - pY}; zCon.setPointerCapture(e.pointerId); };
        zCon.onpointermove = e => {
            for (let i = 0; i < evCache.length; i++) { if (e.pointerId == evCache[i].pointerId) { evCache[i] = e; break; } }
            if (evCache.length == 2) {
                let curDiff = Math.sqrt(Math.pow(evCache[1].clientX - evCache[0].clientX, 2) + Math.pow(evCache[1].clientY - evCache[0].clientY, 2));
                if (prevDiff > 0) {
                    if (curDiff > prevDiff) scale = Math.min(scale + 0.05, 5);
                    if (curDiff < prevDiff) scale = Math.max(scale - 0.05, 0.5);
                    updateT();
                }
                prevDiff = curDiff;
            } else if (isDrag) { pX = e.clientX - start.x; pY = e.clientY - start.y; updateT(); }
        };
        zCon.onpointerup = zCon.onpointercancel = e => {
            evCache = evCache.filter(ev => ev.pointerId !== e.pointerId);
            if (evCache.length < 2) prevDiff = -1; if (evCache.length === 0) isDrag = false;
        };

        function openZoom(zoomUrl, price, name){
            const cleanName = name.split('.')[0];
            document.getElementById('expandedImg').src = zoomUrl; // CARGA LA HD (500x500)
            document.getElementById('zoomName').innerText = cleanName.toUpperCase();
            document.getElementById('zoomPrice').innerText = "PRECIO: $" + price;
            document.getElementById('btnZoomAdd').onclick = function() { playSnd('sndAdd'); addCart(zoomUrl, name, price); closeLightbox(); };
            document.getElementById('btnGameplay').onclick = function() { window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(cleanName + " gameplay")}`, '_blank'); };
            document.getElementById('lightbox').style.display = 'flex';
            resetZoom();
        }

        async function loadFolder(input){
            const files = Array.from(input.files); allItems = [];
            const pF = files.find(f => f.name.toLowerCase() === 'precio.txt');
            if(pF){ const t = await pF.text(); t.split('\n').forEach(l => { const [n, p] = l.split(':'); if(n && p) priceList[n.trim()] = parseFloat(p.trim()); }); }
            files.filter(f => f.type.startsWith('image/')).forEach(file => {
                const url = URL.createObjectURL(file);
                const p = priceList[file.name] || 0;
                allItems.push({ url, zoomUrl: url, name: file.name, price: p, cat: 'LOCAL' });
            });
            renderGrid();
        }

        async function loadFromCloud() {
            const usuario = "Laidel", repositorio = "Games-Florida", pathPrincipal = RUTA_PRINCIPAL; 
            try {
                const response = await fetch(`https://api.github.com/repos/${usuario}/${repositorio}/contents/${pathPrincipal}`);
                const mainContent = await response.json();
                allItems = [];

                const pFile = mainContent.find(f => f.name.toLowerCase() === 'precio.txt');
                if (pFile) {
                    const resP = await fetch(pFile.download_url); const text = await resP.text();
                    text.split('\n').forEach(l => { const [n, p] = l.split(':'); if (n && p) priceList[n.trim()] = parseFloat(p.trim()); });
                }

                for (const item of mainContent) {
                    if (item.type === "dir") {
                        const subRes = await fetch(item.url); const subFiles = await subRes.json();
                        const tDir = subFiles.find(f => f.name.toUpperCase() === "THUMBNAILS");
                        let thumbs = [];
                        if (tDir) { const thumbRes = await fetch(tDir.url); thumbs = await thumbRes.json(); }

                        subFiles.forEach(f => {
                            if (f.type === "file" && f.name.match(/\.(jpg|jpeg|png|webp)$/i)) {
                                const p = priceList[f.name] || 0;
                                const tMatch = thumbs.find(t => t.name === f.name);
                                allItems.push({ 
                                    url: tMatch ? tMatch.download_url : f.download_url, // Miniatura
                                    zoomUrl: f.download_url, // ALTA RESOLUCIÓN (500x500)
                                    name: f.name, 
                                    price: p, 
                                    cat: item.name.toUpperCase() 
                                });
                            }
                        });
                    }
                }
                alert("NUBE SINCRONIZADA ✅ (Zoom HD listo)"); renderGrid();
            } catch (e) { alert("Error de Nube."); }
        }

        function filterCat(c){
            playSnd('sndClick'); currentCat = c;
            document.querySelectorAll('.console-btn').forEach(b => b.classList.toggle('active', b.innerText === c || (c==='TODO' && b.innerText==='TODO')));
            renderGrid();
        }

        function renderGrid(){
            const grid = document.getElementById('imageGrid'); const search = document.getElementById('searchInput').value.toUpperCase();
            grid.innerHTML = '';
            allItems.filter(i => (currentCat==='TODO' || i.cat===currentCat) && i.name.toUpperCase().includes(search)).forEach(i => {
                const d = document.createElement('div'); d.className = 'grid-item';
                d.innerHTML = `<div style="font-size:0.5rem; color:var(--neon); padding:3px; text-align:center; height:18px; overflow:hidden;">${i.name.split('.')[0].toUpperCase()}</div>
                    <div class="price-tag">$${i.price}</div>
                    <img src="${i.url}" style="width:100%; aspect-ratio:1; object-fit:cover;" onclick="openZoom('${i.zoomUrl}', ${i.price}, '${i.name}')">
                    <button class="action-btn" style="font-size:0.55rem; padding:5px; margin:0;" onclick="playSnd('sndAdd'); addCart('${i.zoomUrl}', '${i.name}', ${i.price})">AÑADIR</button>`;
                grid.appendChild(d);
            });
        }

        function addCart(u, n, p) { cart.push({ u, n, p }); updateCart(); }
        function delItem(i) { playSnd('sndTrash'); cart.splice(i, 1); updateCart(); }
        function updateCart() {
            const count = document.getElementById('cartCount'); const list = document.getElementById('cartList');
            count.innerText = cart.length; count.style.display = cart.length>0?'block':'none';
            let total = 0; list.innerHTML = '';
            cart.forEach((item, i) => { total += item.p; list.innerHTML += `<div style="display:flex; align-items:center; gap:10px; border-bottom:1px solid #222; padding:5px 0;"><img src="${item.u}" style="width:30px; height:30px; border-radius:4px;"><div style="flex:1; font-size:0.6rem;">${item.n.split('.')[0]}</div><div class="white-price" style="font-size:0.8rem;">$${item.p}</div><button style="background:var(--red); color:white; border:none; padding:2px 6px; border-radius:4px;" onclick="delItem(${i})">X</button></div>`; });
            document.getElementById('finalPrice').innerText = "TOTAL: $" + total.toFixed(2);
        }

        function updateDateTime() {
            const now = new Date();
            document.getElementById('ticketDateTime').innerText = now.toLocaleDateString() + " - " + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        function takeSnapshot() { html2canvas(document.getElementById('captureArea'), { backgroundColor: "#000", scale: 2 }).then(canvas => { const link = document.createElement('a'); link.href = canvas.toDataURL("image/png"); link.download = 'Ticket_Florida.png'; link.click(); }); }
        function openWhatsApp() { const n = document.getElementById('cName').value || "Cliente"; window.open(`https://wa.me/54935185?text=${encodeURIComponent("Hola Florida Games, soy "+n+". Envío pedido.")}`, '_blank'); }
        function resetTicketButtons() { document.getElementById('btnGenerate').classList.remove('btn-disabled'); document.getElementById('btnWA').style.display='none'; }
    </script>
</body>
</html>
