<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Florida Games v17.9 - ARCHIVOS Global Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --neon: #00ff41; --bg: #000; --red: #ff4444; --dark-neon: #008f11; --taxi-yellow: #ffcc00; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: #eee; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        
        /* PANTALLA INICIO */
        #welcomeScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999999; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border: 5px solid var(--neon); }
        .welcome-title { color: var(--neon); font-size: 2rem; text-shadow: 0 0 15px var(--neon); margin-bottom: 30px; padding: 0 20px; }
        
        /* BOTONES */
        .action-btn { background: var(--neon); color: #000; border: 4px solid var(--dark-neon); padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 10px; box-shadow: 0 4px 0 var(--dark-neon); display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .secondary-btn { background: #111; color: var(--neon); border-color: var(--neon); box-shadow: 0 4px 0 #005a17; }
        
        .container { width: 100%; max-width: 500px; flex: 1; border: 1px solid #333; border-radius: 12px; background: #050505; padding: 10px; position: relative; }
        
        /* GRID Y CATALOGO */
        .console-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 10px; width: 100%; }
        .console-btn { background: #111; color: var(--neon); border: 1px solid var(--neon); padding: 6px 2px; font-size: 0.55rem; border-radius: 4px; font-weight: bold; text-align: center; min-height: 35px; display: flex; align-items: center; justify-content: center; }
        .console-btn.active { background: var(--neon); color: #000; box-shadow: 0 0 15px var(--neon); border-color: #fff; }
        .search-box { width: 100%; background: #111; border: 2px solid var(--neon); border-radius: 8px; padding: 12px; color: var(--neon); margin-bottom: 15px; outline: none; font-family: monospace; }
        
        .grid-3x { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .grid-item { background: #111; border: 1px solid #222; border-radius: 8px; position: relative; overflow: hidden; }
        .price-tag { position: absolute; top: 22px; right: 5px; background: rgba(0,0,0,0.85); color: var(--neon); font-size: 0.65rem; padding: 2px 5px; border: 1px solid var(--neon); z-index: 5; }

        /* LIGHTBOX (AMPLIACIÓN) SIN BORDES */
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000000; flex-direction: column; overflow: hidden; touch-action: none; }
        #zoomContainer { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; cursor: grab; position: relative; padding-bottom: 80px; }
        #expandedImg { max-width: 100%; max-height: 90%; border: none; box-shadow: none; transition: transform 0.1s ease-out; z-index: 1; transform-origin: center center; }
        
        .zoom-info-panel { background: rgba(0,0,0,0.85); width: 100%; padding: 15px; display: flex; flex-direction: column; align-items: center; border-bottom: 2px solid var(--neon); position: absolute; top: 0; z-index: 10; }
        .youtube-bar { position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px; background: rgba(0,0,0,0.95); border-top: 2px solid var(--neon); z-index: 20; display: flex; justify-content: center; }
        .yt-btn { margin: 0; background: #ff0000; color: white; border: 2px solid white; box-shadow: 0 0 15px #ff0000; font-size: 1.1rem; width: 90%; }
        
        /* TICKET Y CARRITO */
        .ticket-input { width: 100%; background: #111; color: #fff; border: 1px solid #333; padding: 10px; margin-bottom: 5px; font-family: monospace; outline: none; }
        .white-price { color: #fff !important; font-weight: bold; }
    </style>
</head>
<body>

    <audio id="sndClick" src="ARCHIVOS/click.mp3"></audio>
    <audio id="sndAdd" src="ARCHIVOS/add.mp3"></audio>
    <audio id="sndTrash" src="ARCHIVOS/trash.mp3"></audio>

    <div id="welcomeScreen">
        <h1 class="welcome-title">Florida Games</h1>
        <button class="action-btn" style="width:280px" onclick="enterApp()">INICIAR APP</button>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:500px; margin-bottom:10px;">
        <button class="action-btn" onclick="showPage('catalogScreen')" style="background:#fff; color:#000;">CATÁLOGO</button>
        <button class="action-btn" onclick="showPage('cartScreen')" style="background:#FFEB3B; color:#000;">CARRITO <span id="cartCountTag"></span></button>
    </div>

    <div class="container">
        <div id="catalogScreen">
            <div class="console-menu">
                <button class="console-btn active" onclick="filterCat('TODO')">TODO</button>
                <button class="console-btn" onclick="filterCat('SNES')">SNES</button>
                <button class="console-btn" onclick="filterCat('NES')">NES</button>
                <button class="console-btn" onclick="filterCat('PS1')">PS1</button>
                <button class="console-btn" onclick="filterCat('PS2')">PS2</button>
                <button class="console-btn" onclick="filterCat('PS4')">PS4</button>
                <button class="console-btn" onclick="filterCat('SWITCH')">SWITCH</button>
                <button class="console-btn" onclick="filterCat('PSP')">PSP</button>
                <button class="console-btn" onclick="filterCat('Wii')">Wii</button>
                <button class="console-btn" onclick="filterCat('N64')">N64</button>
                <button class="console-btn" onclick="filterCat('3DS')">3DS</button>
                <button class="console-btn" onclick="filterCat('DS')">DS</button>
                <button class="console-btn" onclick="filterCat('FIGURAS 3D')">FIG 3D</button>
                <button class="console-btn" onclick="filterCat('PELICULAS')">PELIS</button>
                <button class="console-btn" onclick="filterCat('PC')">PC</button>
                <button class="console-btn" onclick="filterCat('SEGA')">SEGA</button>
                <button class="console-btn" onclick="filterCat('XBOX360')">X360</button>
            </div>
            
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 BUSCAR JUEGO..." onkeyup="renderGrid()">
            <button class="action-btn" style="background:#2196F3; color:white;" onclick="loadFromCloud()">☁️ SINCRONIZAR NUBE (ARCHIVOS)</button>
            
            <div class="grid-3x" id="imageGrid" style="margin-top:15px;"></div>
        </div>

        <div id="cartScreen" style="display:none;">
            <div id="captureArea" style="background:#000; padding:15px; border:1px solid var(--neon);">
                <h3 style="color:var(--neon); text-align:center;">TICKET FLORIDA GAMES</h3>
                <input type="text" id="cName" class="ticket-input" placeholder="CLIENTE">
                <div id="cartList" style="margin:15px 0;"></div>
                <h2 id="finalPrice" class="white-price" style="text-align:right; border-top:1px solid var(--neon);">TOTAL: $0.00</h2>
            </div>
            <button class="action-btn" onclick="takeSnapshot()">📸 GENERAR TICKET</button>
        </div>
    </div>

    <div id="lightbox">
        <div class="zoom-info-panel">
            <div id="zoomName" style="color:#fff; font-size:1rem; text-align:center;"></div>
            <div id="zoomPrice" style="color:var(--neon); font-size:1.8rem; font-weight:bold; margin:10px 0;"></div>
            <div style="display:flex; gap:10px; width:90%;">
                <button id="btnZoomAdd" class="action-btn" style="margin:0;">AÑADIR</button>
                <button class="action-btn" style="background:#f44336; color:white; margin:0;" onclick="closeLightbox()">CERRAR</button>
            </div>
        </div>
        <div id="zoomContainer"><img id="expandedImg" src=""></div>
        <div class="youtube-bar"><button id="btnGameplay" class="yt-btn">▶ VER GAMEPLAY</button></div>
    </div>

    <script>
        const RUTA_PRINCIPAL = "ARCHIVOS";
        let allItems = [], cart = [], priceList = {}, currentCat = 'TODO';

        function playSnd(id){ const s=document.getElementById(id); if(s){ s.currentTime=0; s.play().catch(e=>{}); } }
        function enterApp(){ document.getElementById('welcomeScreen').style.display='none'; playSnd('sndClick'); }
        function showPage(id){ 
            document.getElementById('catalogScreen').style.display = (id==='catalogScreen'?'block':'none'); 
            document.getElementById('cartScreen').style.display = (id==='cartScreen'?'block':'none'); 
        }

        async function loadFromCloud() {
            const user = "Laidel", repo = "Games-Florida";
            try {
                const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${RUTA_PRINCIPAL}`);
                const main = await res.json();
                allItems = [];

                const pFile = main.find(f => f.name.toLowerCase() === 'precio.txt');
                if (pFile) {
                    const r = await fetch(pFile.download_url);
                    const t = await r.text();
                    t.split('\n').forEach(l => { const [n, p] = l.split(':'); if(n && p) priceList[n.trim()] = p.trim(); });
                }

                for (const folder of main) {
                    if (folder.type === "dir") {
                        const sRes = await fetch(folder.url);
                        const sFiles = await sRes.json();
                        
                        const tDir = sFiles.find(f => f.name.toUpperCase() === 'THUMBNAILS');
                        let thumbs = [];
                        if(tDir) { const tR = await fetch(tDir.url); thumbs = await tR.json(); }

                        sFiles.forEach(f => {
                            if (f.name.match(/\.(jpg|jpeg|png|webp)$/i)) {
                                const base = f.name.split('.')[0].toLowerCase();
                                const thumb = thumbs.find(t => t.name.toLowerCase().startsWith(base));
                                
                                allItems.push({
                                    url: f.download_url,
                                    gridUrl: thumb ? thumb.download_url : f.download_url,
                                    name: f.name,
                                    price: priceList[f.name] || "0",
                                    cat: folder.name.toUpperCase()
                                });
                            }
                        });
                    }
                }
                alert("CONECTADO EXITOSAMENTE ✅");
                renderGrid();
            } catch (e) { alert("Error al cargar ARCHIVOS. Revisa tu GitHub."); }
        }

        function renderGrid(){
            const grid = document.getElementById('imageGrid');
            const search = document.getElementById('searchInput').value.toUpperCase();
            grid.innerHTML = '';
            
            allItems.filter(i => (currentCat==='TODO' || i.cat===currentCat) && i.name.toUpperCase().includes(search)).forEach(i => {
                const d = document.createElement('div');
                d.className = 'grid-item';
                d.innerHTML = `
                    <div class="price-tag">$${i.price}</div>
                    <img src="${i.gridUrl}" style="width:100%; aspect-ratio:1; object-fit:cover;" onclick="openZoom('${i.url}', '${i.price}', '${i.name}')">
                    <div style="font-size:0.5rem; text-align:center; padding:3px; color:var(--neon);">${i.name.split('.')[0].toUpperCase()}</div>
                    <button class="action-btn" style="font-size:0.5rem; padding:4px; margin:0; border-width:2px;" onclick="addCart('${i.url}', '${i.name}', '${i.price}')">AÑADIR</button>
                `;
                grid.appendChild(d);
            });
        }

        function openZoom(u, p, n){
            document.getElementById('expandedImg').src = u;
            document.getElementById('zoomName').innerText = n.split('.')[0].toUpperCase();
            document.getElementById('zoomPrice').innerText = "PRECIO: $" + p;
            document.getElementById('lightbox').style.display = 'flex';
            document.getElementById('btnZoomAdd').onclick = () => { addCart(u, n, p); closeLightbox(); };
            document.getElementById('btnGameplay').onclick = () => { window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(n.split('.')[0] + " gameplay")}`, '_blank'); };
        }

        function closeLightbox(){ document.getElementById('lightbox').style.display='none'; }
        function filterCat(c){ playSnd('sndClick'); currentCat = c; renderGrid(); }
        
        function addCart(u, n, p){ 
            playSnd('sndAdd');
            cart.push({u, n, p: parseFloat(p)}); 
            updateCart(); 
        }

        function updateCart(){
            document.getElementById('cartCountTag').innerText = cart.length > 0 ? `(${cart.length})` : '';
            const list = document.getElementById('cartList');
            let total = 0;
            list.innerHTML = '';
            cart.forEach((item, i) => {
                total += item.p;
                list.innerHTML += `<div style="display:flex; justify-content:space-between; color:white; font-size:0.7rem; margin-bottom:5px;"><span>${item.n.split('.')[0]}</span><span>$${item.p}</span></div>`;
            });
            document.getElementById('finalPrice').innerText = "TOTAL: $" + total.toFixed(2);
        }

        function takeSnapshot() {
            html2canvas(document.getElementById('captureArea'), { backgroundColor: "#000", scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.href = canvas.toDataURL("image/png");
                link.download = 'Ticket_Florida_' + Date.now() + '.png';
                link.click();
            });
        }
    </script>
</body>
</html>
